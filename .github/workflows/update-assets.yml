name: Update Assets

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: DGLab

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Update dependencies
        run: pnpm update

      - name: Build Tailwind CSS
        run: pnpm run build

      - name: Copy Vendor Assets
        run: |
          mkdir -p assets/js/vendor
          cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js assets/js/vendor/
          cp node_modules/jquery/dist/jquery.min.js assets/js/vendor/

          mkdir -p assets/vendor/fontawesome/css
          mkdir -p assets/vendor/fontawesome/webfonts
          cp -r node_modules/@fortawesome/fontawesome-free/css/* assets/vendor/fontawesome/css/
          cp -r node_modules/@fortawesome/fontawesome-free/webfonts/* assets/vendor/fontawesome/webfonts/

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update local assets and recompile CSS" && git push origin DGLab)
